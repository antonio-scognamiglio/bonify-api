spring.application.name=bonify

# API versioning: /api/{version}/... -> the version is the path segment at index 1
spring.mvc.apiversion.use.path-segment=1
spring.mvc.apiversion.supported=1
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT (HS256): the secret must be at least 32 bytes, see functional-analysis.md NFR-01 / NFR-02
bonify.jwt.secret=${JWT_SECRET}
bonify.jwt.issuer=bonify
bonify.jwt.expiration=60m
# Refresh token: opaque, rotated on every use, one active session per customer
bonify.jwt.refresh-expiration=7d
