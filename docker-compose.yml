name: bonify

services:
  postgres:
    image: postgres:16
    container_name: postgres-bonify
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: bonyfy-db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres-data:
