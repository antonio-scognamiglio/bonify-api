name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bonify-test
          POSTGRES_USER: bonify-ci
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bonify-ci -d bonify-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B verify
        env:
          DB_NAME: bonify-test
          DB_USER: bonify-ci
          DB_PASSWORD: ci-test-password
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
